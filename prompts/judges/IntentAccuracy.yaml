id: IntentAccuracy
name: IntentAccuracy
target_agent: intent_preprocess
target_node: intent_preprocess
kind: geval
threshold: 0.7
evaluation_params:
  - INPUT
  - ACTUAL_OUTPUT
  - EXPECTED_OUTPUT
criteria: |
  判断客服意图识别是否正确。actual output 是模型预测意图，expected output 是标注意图。
evaluation_steps:
  - 读取用户原话与标注意图。
  - 对比预测意图；允许同义（如 refund 与 return）给高分。
  - 完全不同类别给 0 分；相邻类别（refund vs shipping）给 0.3-0.5。
  - 给出简短中文理由。
notes: |
  单 Agent 评测：只喂子 Agent 1 的 predicted intent，不要看最终回复。
