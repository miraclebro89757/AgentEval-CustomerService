id: RoutingCorrectness
name: RoutingCorrectness
target_agent: supervisor
target_node: supervisor
kind: geval
threshold: 0.7
evaluation_params:
  - INPUT
  - ACTUAL_OUTPUT
  - EXPECTED_OUTPUT
criteria: |
  主 Agent 是否把请求分给了正确的子 Agent（rag_agent / tool_agent / direct_reply）。
  预处理命中安全策略时应为 blocked，且后续节点不应再跑。
evaluation_steps:
  - 理解三种路由的职责：rag=知识库，tool=订单/工单工具，direct=问候或拒答。
  - 对比预测路由与标注路由。
  - 路由错误即使最终回复碰巧能用也要给低分。
notes: |
  单 Agent 评测：只喂 Supervisor 的 route，不要用最终回复是否正确来开脱。
